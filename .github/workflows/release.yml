name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o vpn-ui-amd64 -ldflags "-s -w -X main.version=${{ github.ref_name }}" .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: vpn-ui-amd64
          generate_release_notes: true
