name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc gcc-multilib

      - name: Build
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o vpn-ui-amd64 .

      - name: Verify CGO
        run: |
          file vpn-ui-amd64
          strings vpn-ui-amd64 | grep -q "PT_INTERP" && echo "CGO OK" || (echo "CGO MISSING" && exit 1)

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: vpn-ui-amd64
          generate_release_notes: true
