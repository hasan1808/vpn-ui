name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc gcc-multilib

      # The bundled VPN daemons (telemt, xl2tpd, openvpn, pptpd, ocserv,
      # accel-ppp, strongSwan, …) are NOT committed: backend/bin is git-ignored,
      # so a fresh checkout embeds nothing and every bundled core reports "not
      # installed / binary not bundled for this architecture" — MTProto most
      # visibly, since telemt exists in no distro repo and can only ever come
      # from this bundle. Build the amd64 bundle (Docker + Alpine, slow) so the
      # go build below embeds real daemons via //go:embed all:bin.
      # The download hosts (OpenVPN, sourceforge, infradead) are flaky from CI
      # egress, so retry the whole bundle a few times instead of failing on a
      # single transient blip that dl_retry's in-place retries may not catch.
      - name: Build daemon bundle (amd64)
        run: |
          for attempt in 1 2 3; do
            echo "=== daemon bundle build attempt $attempt ==="
            if bash build/backend/build.sh amd64; then
              echo "=== daemon bundle build succeeded on attempt $attempt ==="
              exit 0
            fi
            echo "=== attempt $attempt failed, retrying in 30s ==="
            sleep 30
          done
          echo "=== daemon bundle build failed after 3 attempts ==="
          exit 1

      - name: Build
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "$VERSION" > version
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X github.com/hasan1808/pro-ui/config.version=$VERSION" -o vpn-ui-amd64 .

      - name: Verify CGO
        run: |
          file vpn-ui-amd64 | grep -q "dynamically linked" && echo "CGO OK" || (echo "CGO MISSING - not dynamically linked" && exit 1)

      - name: Compress binary asset
        run: |
          # Ship a gzip of the binary too: the self-updater and deploy.sh prefer the
          # ~3x smaller .gz over slow or throttled links, decompressing on the server.
          gzip -9 -k vpn-ui-amd64
          ls -lh vpn-ui-amd64 vpn-ui-amd64.gz

      - name: Build core bundle (amd64)
        run: |
          # Build the pinned Xray core and geo files so we can attach them as release assets
          bash build/core/build.sh amd64

      - name: Package backend and core bundles
        run: |
          set -euo pipefail
          # Create a backend archive containing the built backend binaries and any .tgz relocatable bundles
          tar -C backend -czf backend-amd64.tgz bin/amd64 || true
          # Package the corebundle directory (xray + geo files)
          tar -C corebundle -czf core-amd64.tgz core || true

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: vpn-ui-amd64,vpn-ui-amd64.gz,core-amd64.tgz,backend-amd64.tgz
          generate_release_notes: true
