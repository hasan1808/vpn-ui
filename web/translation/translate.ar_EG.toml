"userLimit" = "حد المستخدم"
"userLimitDesc" = "أقصى عدد لعناوين العملاء المتزامنة لكل حساب، ويطبقه الوكيل نفسه (يرفض الاتصال الزائد). القيمة الافتراضية هي 10، والقيمة 0 ليست بلا حد بل تسمح بـ 16. الأجهزة التي تتشارك عنوانا واحدا خلف NAT تحسب جهازا واحدا."
"adtag" = "وسم الإعلان"
"adtagDesc" = "روج لقناة راعية بوسم من @MTProxybot. اقرأ التحذير قبل التفعيل: فهو يوقف توجيه Xray لكل الحسابات على هذا الاتصال الوارد."
"adtagPlaceholder" = "32 حرفا ست عشريا من @MTProxybot"
"adtagClientWarn" = "ضبط وسم لهذا الحساب وحده ينقل الاتصال الوارد كله إلى مرحلات تليجرام الوسيطة. وكل حساب آخر على هذا الاتصال الوارد يخرج هو أيضا مباشرة من هذا الخادم، ولا تنطبق قواعد توجيه Xray لديك على أي منها. امسح الوسم عن كل الحسابات هنا لاستعادة التوجيه."
"adtagRoutingOffTitle" = "وسم الإعلان يوقف توجيه Xray لهذا الاتصال الوارد"
"adtagRoutingOffDesc" = "لا يحتسب وسم الإعلان إلا إذا مرت حركة البيانات عبر مرحلات تليجرام الوسيطة، وهذا المسار خاصية لعملية الوكيل نفسها. وطالما كان الوسم مضبوطا فإن كل الحسابات على هذا الاتصال الوارد تخرج مباشرة من هذا الخادم ولا تنطبق عليها أي من قواعد التوجيه الصادرة لديك. يشتق تليجرام مفتاح جلسة الوكيل الوسيط من عنوان ومنفذ الخروج لهذا الخادم، لذا فإن إرسال تلك الحركة عبر Xray يغير المنفذ ويكسر المصافحة. امسح وسم الإعلان لتوجيه هذا الاتصال الوارد عبر Xray."

