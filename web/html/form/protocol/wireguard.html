{{define "form/wireguard"}}
<a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
  <a-form-item>
    <template slot="label">
      <a-tooltip>
        <template slot="title">
          <span>{{ i18n "reset" }}</span>
        </template>
        {{ i18n "pages.xray.wireguard.secretKey" }}
        <a-icon type="sync"
          @click="[inbound.settings.pubKey, inbound.settings.secretKey] = Object.values(Wireguard.generateKeypair())"></a-icon>
      </a-tooltip>
    </template>
    <a-input v-model.trim="inbound.settings.secretKey"></a-input>
  </a-form-item>
  <a-form-item label='{{ i18n "pages.xray.wireguard.publicKey" }}'>
    <a-input disabled v-model="inbound.settings.pubKey"></a-input>
  </a-form-item>
  <a-form-item label='MTU'>
    <a-input-number v-model.number="inbound.settings.mtu"></a-input-number>
  </a-form-item>
  <a-form-item label='No Kernel Tun'>
    <a-switch v-model="inbound.settings.noKernelTun"></a-switch>
  </a-form-item>
  <!-- Accounts are added on the Clients page like every other protocol's, and the
       server turns each one into a peer on the way to Xray. These two decide what
       it hands them: the pool their tunnel addresses come out of (its first host is
       this inbound's own address) and how many keypairs each account gets, since two
       WireGuard devices cannot share one. -->
  <a-form-item>
    <template slot="label">
      <a-tooltip>
        <template slot="title">{{ i18n "pages.xray.wireguard.clientNetworkDesc" }}</template>
        {{ i18n "pages.xray.wireguard.clientNetwork" }}
      </a-tooltip>
    </template>
    <a-input v-model.trim="inbound.settings.clientNetwork" placeholder="10.10.0.0/24"></a-input>
  </a-form-item>
  <a-form-item>
    <template slot="label">
      <a-tooltip>
        <template slot="title">{{ i18n "pages.xray.wireguard.devicesPerClientDesc" }}</template>
        {{ i18n "pages.xray.wireguard.devicesPerClient" }}
      </a-tooltip>
    </template>
    <a-input-number v-model.number="inbound.settings.userLimit" :min="1" :max="64"></a-input-number>
  </a-form-item>
  <a-alert type="info" show-icon :style="{ marginBottom: '12px' }"
    message='{{ i18n "pages.xray.wireguard.noAccounting" }}'></a-alert>
  <!-- Peers added BY HAND, kept for anything that is not an account: the generated
       config carries these and the managed clients both. -->
  <a-form-item label="Peers">
    <a-button icon="plus" type="primary" size="small" @click="inbound.settings.addPeer()"></a-button>
  </a-form-item>
  <a-form v-for="(peer, index) in inbound.settings.peers" :colon="false" :label-col="{ md: {span:8} }"
    :wrapper-col="{ md: {span:14} }">
    <a-divider :style="{ margin: '0' }"> Peer [[ index + 1 ]] <a-icon v-if="inbound.settings.peers.length>1"
        type="delete" @click="() => inbound.settings.delPeer(index)"
        :style="{ color: 'rgb(255, 77, 79)', cursor: 'pointer' }"></a-icon>
    </a-divider>
    <a-form-item>
      <template slot="label">
        <a-tooltip>
          <template slot="title">
            <span>{{ i18n "reset" }}</span>
          </template>
          {{ i18n "pages.xray.wireguard.secretKey" }}
          <a-icon @click="[peer.publicKey, peer.privateKey] = Object.values(Wireguard.generateKeypair())"
            type="sync"></a-icon>
        </a-tooltip>
      </template>
      <a-input v-model.trim="peer.privateKey"></a-input>
    </a-form-item>
    <a-form-item>
      <template slot="label">
        {{ i18n "pages.xray.wireguard.publicKey" }}
      </template>
      <a-input v-model.trim="peer.publicKey"></a-input>
    </a-form-item>
    <a-form-item>
      <template slot="label">
        <a-tooltip>
          <template slot="title">
            <span>{{ i18n "reset" }}</span>
          </template>
          {{ i18n "pages.xray.wireguard.psk" }}
          <a-icon @click="peer.psk = Wireguard.keyToBase64(Wireguard.generatePresharedKey())" type="sync"></a-icon>
        </a-tooltip>
      </template>
      <a-input v-model.trim="peer.psk"></a-input>
    </a-form-item>
    <a-form-item>
      <template slot="label">
        {{ i18n "pages.xray.wireguard.allowedIPs" }}
        <a-button icon="plus" type="primary" size="small" @click="peer.allowedIPs.push('')"></a-button>
      </template>
      <template v-for="(aip, index) in peer.allowedIPs" :style="{ marginBottom: '10px' }">
        <a-input v-model.trim="peer.allowedIPs[index]">
          <a-button icon="minus" v-if="peer.allowedIPs.length>1" slot="addonAfter" size="small"
            @click="peer.allowedIPs.splice(index, 1)"></a-button>
        </a-input>
      </template>
    </a-form-item>
    <a-form-item label='Keep Alive'>
      <a-input-number v-model.number="peer.keepAlive" :min="0"></a-input-number>
    </a-form-item>
  </a-form>
</a-form>
{{end}}
