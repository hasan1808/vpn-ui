{{define "component/clientActions"}}
<script>
  // Everything the client surface does, as a Vue mixin, so the page that OWNS
  // clients and the page that merely counts them share one implementation.
  //
  // It lives in a template rather than assets/js because half of these methods
  // build user-visible strings with {{ "{{" }} i18n ... {{ "}}" }}, which only Go's html/template
  // expands; a plain .js asset is served verbatim and would ship the literal
  // braces to the browser.
  //
  // The host page owes this mixin the following, because each one means something
  // different depending on what the page is a list OF:
  //   methods: submit(url, data, modal)   the write funnel; inbounds.html also gates
  //                                       inbound CREATES on the core being installed
  //            getDBInbounds()            re-read the inbound list after a write
  //            loading(spinning)          page-level spinner
  //            refreshResellerBalance()   re-read the reseller's balance chip
  //   state:   dbInbounds, inbounds, membershipIndex, onlineClients,
  //            onlineMemberships, lastOnlineMap, selInbounds, selClients,
  //            expireDiff, trafficDiff
  //
  // Vue merges a page's own methods over a mixin's, so a page may override any of
  // the rest the same way.
  //
  // Four of these open a modal the CLIENTS page includes and the Inbounds page
  // does not, so calling one from a page that omits the include is a
  // ReferenceError rather than a no-op:
  //
  //   showWgcConfig                   -> modals/wgcConfigModal
  //   showAwgConfig                   -> modals/awgConfigModal
  //   showGreConfig                   -> modals/greConfigModal
  //   showSshConfig                   -> modals/sshConfigModal
  //
  // The rest reach only qrcodeModal and inboundInfoModal, which both pages carry.
  // Inbounds uses eight of these in total and is fine; a page that starts calling
  // one of the four has to add the include with it.
  //
  // Adding and editing an account are NOT here. They belong to the Clients page's
  // own forms (modals/clientMembershipModal and modals/clientsBulkModal), which
  // are account-shaped rather than inbound-shaped: they carry one credential set
  // and a membership list, where a mixin helper could only ever speak for the one
  // inbound it was handed.

  // Every bulk operation the modal can offer, in the order it lists them.
  const BULK_OPS = ['addDays', 'subDays', 'addTraffic', 'subTraffic',
    'enable', 'disable', 'freeze', 'unfreeze', 'addInbounds', 'removeInbounds', 'delete'];

  // The two that change WHICH INBOUNDS serve an account rather than what the
  // account is allowed. They do not go through the bulk client applier at all:
  // see runBulkMembership.
  const BULK_MEMBERSHIP_OPS = ['addInbounds', 'removeInbounds'];

  // Four of them are withheld from a reseller. subDays is refused outright by the
  // server for a reseller, so offering it only buys them a failed run. addDays is
  // dropped when their profile derives an account's duration from its traffic
  // (daysPerGb): the day count is recomputed from the GB on the next edit, so a
  // manual change there looks applied and then quietly is not. The two membership
  // ops are an admin's call: a reseller's grant says which inbounds they may sell
  // FROM, not that they may move a customer between them, and the server refuses
  // them the same way.
  // Presentation only, as always: the server re-checks all four.
  function isBulkOpAllowed(op) {
    if (op === 'subDays' && RESELLER.isReseller) return false;
    if (op === 'addDays' && (Number(RESELLER.daysPerGb) || 0) > 0) return false;
    if (BULK_MEMBERSHIP_OPS.includes(op) && RESELLER.isReseller) return false;
    return true;
  }

  // The three protocols whose accounts cannot be told apart across two inbounds of
  // the same kind, mirrored from ValidateMembershipSet (web/service/account.go).
  // Presentation only: the server refuses the set per account regardless.
  const BULK_AMBIGUOUS_PROTOCOLS = ['l2tp', 'pptp', 'ikev2'];

  // The first option that survives the filter, so the select never opens pointing
  // at an operation it does not render. An a-select bound to a value with no
  // matching option shows the bare value string instead of a label.
  const DEFAULT_BULK_OP = BULK_OPS.find(isBulkOpAllowed) || 'addTraffic';

  // One account's identity, the way the server keys it (accountKey in
  // web/service/account.go): the email, trimmed and lower-cased. Two rows that
  // reduce to the same key are the SAME account on two inbounds, not two accounts.
  function accountKeyOf(email) {
    return typeof email === 'string' ? email.trim().toLowerCase() : '';
  }

  const ClientActionsMixin = {
    // Selection and bulk-run state travel with the methods that drive them, so a
    // page only has to mix this in to get a working selection.
    data() {
      return {
        selInbounds: [],
        selClients: [],
        bulkOps: {
          visible: false,
          confirmLoading: false,
          op: DEFAULT_BULK_OP,
          amount: 1,
          unit: 'GB',
          skipFirstUse: false,
          skipUnlimited: false,
          skipDisabled: false,
          // The inbounds the two membership ops add to / remove from. Declared
          // here rather than added when the op is picked: Vue 2 walks this object
          // once, so a key bolted on later is bound to nothing and the checkbox
          // group would tick boxes that never re-render.
          inboundIds: [],
          progress: { running: false, done: 0, total: 0, applied: 0, skipped: 0, etaText: '' },
        },
      };
    },
    computed: {
      // Which inbounds serve each account, keyed by account identity (the email,
      // the way accountKey reduces it server-side).
      //
      // No request behind it: an account served on several inbounds is written into
      // settings.clients on every one of them (the projection in
      // web/service/accountproject.go), so the list this page already holds IS the
      // membership set. Cached as a computed because building it parses every
      // inbound's settings JSON, and both readers run per rendered row.
      membershipIndex() {
        const index = {};
        this.dbInbounds.forEach(dbInbound => {
          const clients = this.getInboundClients(dbInbound);
          if (!Array.isArray(clients)) return;
          const entry = {
            id: dbInbound.id,
            remark: dbInbound.remark,
            protocol: dbInbound.protocol,
            port: dbInbound.port,
          };
          clients.forEach(client => {
            const key = accountKeyOf(client && client.email);
            if (!key) return;
            if (!index[key]) index[key] = [];
            index[key].push(entry);
          });
        });
        return index;
      },
    },
    methods: {
      clearSelection() { this.selInbounds = []; this.selClients = []; },
      resolveSelectedTargets() {
        const map = {};
        const add = (inboundId, email) => { if (email) map[inboundId + ':' + email] = { inboundId, email }; };
        this.selInbounds.forEach(id => {
          const dbInbound = this.dbInbounds.find(r => r.id === id);
          (this.getInboundClients(dbInbound) || []).forEach(c => add(id, c.email));
        });
        this.selClients.forEach(k => { const i = k.indexOf(':'); add(Number(k.slice(0, i)), k.slice(i + 1)); });
        return Object.values(map);
      },
      selectedCount() { return this.resolveSelectedTargets().length; },
      inboundTargets(dbInbound) {
        return (this.getInboundClients(dbInbound) || [])
          .map(c => c.email).filter(Boolean)
          .map(email => ({ inboundId: dbInbound.id, email }));
      },
      exportSelectedTxt() { this.exportTxt(this.resolveSelectedTargets(), 'accounts'); },
      exportSelectedPdf() { this.exportPdf(this.resolveSelectedTargets(), 'accounts'); },
      // --- bulk operations ----------------------------------------------
      openBulkOps() {
        if (!this.selectedCount()) { this.$message.warning('{{ i18n "pages.inbounds.exportNoneSelected" }}'); return; }
        this.bulkOps.progress = { running: false, done: 0, total: 0, applied: 0, skipped: 0, etaText: '' };
        // The inbound picks do NOT survive the modal closing: they name a
        // destination for one specific batch, and re-opening on a different
        // selection with the last run's inbounds still ticked is how an operator
        // re-homes the wrong customers.
        this.bulkOps.inboundIds = [];
        // A previous run may have left a selection that is no longer offered, and
        // the value survives the modal closing. Snap it back to a rendered option.
        if (!isBulkOpAllowed(this.bulkOps.op)) this.bulkOps.op = DEFAULT_BULK_OP;
        this.bulkOps.visible = true;
      },
      // Template hook for the option filter; the rule itself lives in isBulkOpAllowed.
      bulkOpAllowed(op) { return isBulkOpAllowed(op); },
      bulkIsTrafficOp() { return ['addTraffic', 'subTraffic'].includes(this.bulkOps.op); },
      bulkIsNumericOp() { return ['addDays', 'subDays', 'addTraffic', 'subTraffic'].includes(this.bulkOps.op); },
      // --- the inbound checklist the two membership ops render ------------
      bulkIsMembershipOp() { return BULK_MEMBERSHIP_OPS.includes(this.bulkOps.op); },
      // The page's own inbound picker list (GET /panel/api/clients/assignable),
      // already loaded and already filtered to what this caller may assign. The
      // guard is for the Inbounds page, which mixes this in and does not hold one:
      // it never opens the modal, so the list is simply empty there.
      bulkAssignable() { return this.assignable || []; },
      bulkAllInboundsChecked() {
        const all = this.bulkAssignable();
        return all.length > 0 && this.bulkOps.inboundIds.length === all.length;
      },
      bulkSomeInboundsChecked() {
        const n = this.bulkOps.inboundIds.length;
        return n > 0 && n < this.bulkAssignable().length;
      },
      bulkToggleAllInbounds(e) {
        this.bulkOps.inboundIds = e.target.checked
          ? this.bulkAssignable().map(i => i.inboundId) : [];
      },
      // Two inbounds of the same ambiguous protocol in ONE batch, which the server
      // refuses for every account it would apply to. Said here so the whole run is
      // not spent discovering it one account at a time.
      //
      // It cannot see the other half of the rule: an account ALREADY on an l2tp
      // inbound being added to a second one clashes too, and only the server knows
      // each account's current set. Those come back as skips with a reason.
      bulkProtocolClash() {
        if (this.bulkOps.op !== 'addInbounds') return false;
        const seen = {};
        for (const id of this.bulkOps.inboundIds) {
          const ib = this.bulkAssignable().find(x => x.inboundId === id);
          if (!ib || !BULK_AMBIGUOUS_PROTOCOLS.includes(ib.protocol)) continue;
          if (seen[ib.protocol]) return true;
          seen[ib.protocol] = true;
        }
        return false;
      },
      bulkProgressPercent() {
        const p = this.bulkOps.progress;
        return p.total > 0 ? Math.floor((p.done / p.total) * 100) : 0;
      },
      bulkFormatEta(sec) {
        sec = Math.max(0, Math.ceil(sec));
        if (sec >= 60) { return Math.floor(sec / 60) + 'm ' + (sec % 60) + 's'; }
        return sec + 's';
      },
      // Asks the server what this batch WOULD cost, and when a reseller cannot
      // afford all of it, offers the part they can instead of failing the run.
      //
      // Returns the target list to actually send, or null to abandon. Admins and
      // affordable batches pass straight through: the path that already works
      // must not grow a dialog.
      async bulkConfirmAffordable(base, targets) {
        if (!RESELLER.isReseller) return targets;
        let p = null;
        try {
          const msg = await HttpUtil.post('/panel/api/inbounds/bulkPreview',
            { data: JSON.stringify(Object.assign({}, base, { targets })) });
          if (!msg || !msg.success) return null;
          p = msg.obj || {};
        } catch (e) {
          return null;
        }
        if (!p.isReseller || p.affordable) return targets;

        const short = SizeFormatter.sizeFormat(Number(p.shortBytes) || 0);
        const can = Number(p.canProcess) || 0;
        const eligible = Number(p.eligible) || 0;
        // Nothing fits, so there is no partial run to offer and asking them to
        // confirm one would be a dialog with no useful answer.
        if (can <= 0) {
          this.$message.error('{{ i18n "pages.resellers.bulkShort" }} ' + short +
            '. {{ i18n "pages.resellers.available" }}: ' +
            SizeFormatter.sizeFormat(Number(p.availableBytes) || 0));
          return null;
        }
        // The emails the server says fit, mapped back to full targets so the run
        // posts the same (inbound, email) pairs it always does. Anything the
        // server did not name is dropped, never guessed at.
        const keep = new Set((p.processEmails || []).map(e => String(e).toLowerCase()));
        const narrowed = targets.filter(t => keep.has(String(t.email || '').toLowerCase()));
        const ok = await new Promise((resolve) => {
          this.$confirm({
            title: '{{ i18n "pages.inbounds.bulkOperations" }}',
            content: '{{ i18n "pages.resellers.bulkShort" }} ' + short +
              '. {{ i18n "pages.resellers.bulkPartial" }}: ' + can + ' / ' + eligible,
            okText: '{{ i18n "confirm" }}',
            cancelText: '{{ i18n "cancel" }}',
            class: themeSwitcher.currentTheme,
            onOk: () => resolve(true),
            onCancel: () => resolve(false),
          });
        });
        return ok ? narrowed : null;
      },
      async runBulkOps() {
        const b = this.bulkOps;
        // Delete removes whatever is checked: a selected INBOUND is deleted wholesale
        // (its accounts go with it, no per-client filtering), a selected ACCOUNT is
        // removed on its own. Separate flow from the in-place client update ops.
        if (b.op === 'delete') return this.runBulkDelete();
        // Membership is not a client field, so it does not go through the client
        // applier: it is written through the accounts layer, on its own route.
        if (this.bulkIsMembershipOp()) return this.runBulkMembership();
        let targets = this.resolveSelectedTargets();
        if (!targets.length) return;
        const amount = Math.max(0, Number(b.amount) || 0);
        const bytes = b.unit === 'MB' ? 1024 * 1024 : 1024 * 1024 * 1024;
        const base = {
          op: b.op,
          days: this.bulkIsTrafficOp() ? 0 : amount,
          amountBytes: this.bulkIsTrafficOp() ? Math.round(amount * bytes) : 0,
          skipFirstUse: b.skipFirstUse,
          skipUnlimited: b.skipUnlimited,
          skipDisabled: b.skipDisabled,
        };
        // Priced before a single batch goes out. A reseller who cannot afford the
        // whole run is told the shortfall and how many accounts fit, and either
        // confirms the partial run or abandons it. Doing this per batch instead
        // would ask them the same question five times mid-run, with some of it
        // already spent.
        targets = await this.bulkConfirmAffordable(base, targets);
        if (!targets || !targets.length) return;
        b.progress = { running: false, done: 0, total: 0, applied: 0, skipped: 0, etaText: '' };
        // Batch the targets so the modal can show real per-item progress + ETA
        // (the backend accepts an arbitrary target list, so this is honest progress,
        // not a fake animation). One request per batch, sequential.
        const BATCH = 20;
        const batches = [];
        for (let i = 0; i < targets.length; i += BATCH) batches.push(targets.slice(i, i + BATCH));
        b.confirmLoading = true;
        b.progress = { running: true, done: 0, total: targets.length, applied: 0, skipped: 0, etaText: '' };
        const start = Date.now();
        let ok = true;
        for (let i = 0; i < batches.length; i++) {
          const payload = Object.assign({}, base, { targets: batches[i] });
          const msg = await HttpUtil.post('/panel/api/inbounds/bulkUpdateClients', { data: JSON.stringify(payload) });
          if (!msg.success) { ok = false; break; }
          const r = msg.obj || {};
          b.progress.applied += (r.applied || 0);
          b.progress.skipped += (r.skipped || 0);
          b.progress.done += batches[i].length;
          const elapsed = (Date.now() - start) / 1000;
          const rate = elapsed > 0 ? b.progress.done / elapsed : 0;
          const remaining = b.progress.total - b.progress.done;
          b.progress.etaText = (rate > 0 && remaining > 0) ? this.bulkFormatEta(remaining / rate) : '';
        }
        b.progress.running = false;
        b.confirmLoading = false;
        // Refreshed whether or not the whole run succeeded: batches are applied one
        // request at a time, so a run that broke on batch three still spent the
        // balance the first two cost.
        await this.refreshResellerBalance();
        if (ok) {
          b.visible = false;
          this.$message.success('{{ i18n "pages.inbounds.bulkDone" }} {{ i18n "pages.inbounds.bulkAffected" }}: ' + b.progress.applied + ' {{ i18n "pages.inbounds.bulkSkipped" }}: ' + b.progress.skipped);
          this.clearSelection();
          await this.getDBInbounds();
        }
      },
      // Add the selected accounts to, or remove them from, the ticked inbounds.
      //
      // Batched by ACCOUNT rather than by target, which is the one thing this
      // cannot borrow from runBulkOps. A target is an (inbound, email) pair and an
      // account contributes one per membership it already has, so a fixed slice of
      // twenty TARGETS can cut one account's pairs across two requests. The server
      // reduces each request to the accounts it names, so the same account in two
      // requests is the operation applied twice: harmless for the add (the second
      // is a no-op skip) and a lie in the counters for both. Grouping first also
      // makes the progress bar count customers, which is what the operator picked.
      async runBulkMembership() {
        const b = this.bulkOps;
        const inboundIds = (b.inboundIds || []).slice();
        if (!inboundIds.length) {
          this.$message.warning('{{ i18n "pages.inbounds.bulkMembershipNoInbound" }}');
          return;
        }
        if (this.bulkProtocolClash()) {
          this.$message.error('{{ i18n "pages.inbounds.membershipSameProtocol" }}');
          return;
        }
        const groups = {};
        this.resolveSelectedTargets().forEach(t => {
          const key = accountKeyOf(t.email);
          if (!key) return;
          if (!groups[key]) groups[key] = [];
          groups[key].push(t);
        });
        const accounts = Object.values(groups);
        if (!accounts.length) return;

        b.confirmLoading = true;
        b.progress = { running: true, done: 0, total: accounts.length, applied: 0, skipped: 0, etaText: '' };
        const start = Date.now();
        const BATCH = 20;
        const reasons = [];
        let ok = true;
        for (let i = 0; i < accounts.length; i += BATCH) {
          const group = accounts.slice(i, i + BATCH);
          const targets = [].concat.apply([], group);
          const msg = await HttpUtil.post('/panel/api/inbounds/bulkMembership',
            { data: JSON.stringify({ op: b.op, inboundIds, targets }) });
          if (!msg.success) { ok = false; break; }
          const r = msg.obj || {};
          b.progress.applied += (r.applied || 0);
          b.progress.skipped += (r.skipped || 0);
          b.progress.done += group.length;
          (r.reasons || []).forEach(x => { if (!reasons.includes(x)) reasons.push(x); });
          this.bulkTickEta(start);
        }
        b.progress.running = false;
        b.confirmLoading = false;
        if (ok) {
          b.visible = false;
          this.$message.success('{{ i18n "pages.inbounds.bulkDone" }} {{ i18n "pages.inbounds.bulkAffected" }}: ' + b.progress.applied + ' {{ i18n "pages.inbounds.bulkSkipped" }}: ' + b.progress.skipped);
          // A skip here is a refusal with a cause, not a filtered-out row, so the
          // causes are shown rather than left as a number. Capped and held longer
          // than a success toast, because they are the part worth reading.
          if (reasons.length) {
            this.$message.warning(reasons.slice(0, 4).join(' · '), 10);
          }
          this.clearSelection();
          await this.getDBInbounds();
        }
      },
      bulkTickEta(start) {
        const p = this.bulkOps.progress;
        const elapsed = (Date.now() - start) / 1000;
        const rate = elapsed > 0 ? p.done / elapsed : 0;
        const remaining = p.total - p.done;
        p.etaText = (rate > 0 && remaining > 0) ? this.bulkFormatEta(remaining / rate) : '';
      },
      async runBulkDelete() {
        const b = this.bulkOps;
        // Whole inbounds selected -> delete the inbound (its accounts go with it, no
        // per-client filtering). Accounts selected on their own (inbound NOT wholesale-
        // selected) -> delete just those.
        const inboundIds = this.selInbounds.slice();
        const clientTargets = this.selClients
          .filter(k => !inboundIds.includes(Number(k.slice(0, k.indexOf(':')))))
          .map(k => { const i = k.indexOf(':'); return { inboundId: Number(k.slice(0, i)), email: k.slice(i + 1) }; });
        const totalUnits = inboundIds.length + clientTargets.length;
        if (!totalUnits) return;
        const okDel = await new Promise((resolve) => {
          this.$confirm({
            title: '{{ i18n "pages.inbounds.opDelete" }}',
            content: '{{ i18n "pages.inbounds.bulkDeleteConfirm" }}'
              .replace('%INBOUNDS%', inboundIds.length).replace('%CLIENTS%', clientTargets.length),
            okText: '{{ i18n "delete" }}',
            okType: 'danger',
            class: themeSwitcher.currentTheme,
            cancelText: '{{ i18n "cancel" }}',
            onOk: () => resolve(true),
            onCancel: () => resolve(false),
          });
        });
        if (!okDel) return;
        b.confirmLoading = true;
        b.progress = { running: true, done: 0, total: totalUnits, applied: 0, skipped: 0, etaText: '' };
        const start = Date.now();
        let ok = true;
        // 1) whole inbounds (one request each; each triggers its own config regen).
        for (const id of inboundIds) {
          const msg = await HttpUtil.post('/panel/api/inbounds/del/' + id);
          if (!msg.success) { ok = false; break; }
          b.progress.applied++;
          b.progress.done++;
          this.bulkTickEta(start);
        }
        // 2) standalone accounts (batched, reuses the bulk 'delete' op).
        if (ok && clientTargets.length) {
          const base = {
            op: 'delete', days: 0, amountBytes: 0,
            skipFirstUse: b.skipFirstUse, skipUnlimited: b.skipUnlimited, skipDisabled: b.skipDisabled,
          };
          const BATCH = 20;
          for (let i = 0; i < clientTargets.length; i += BATCH) {
            const batch = clientTargets.slice(i, i + BATCH);
            const msg = await HttpUtil.post('/panel/api/inbounds/bulkUpdateClients',
              { data: JSON.stringify(Object.assign({}, base, { targets: batch })) });
            if (!msg.success) { ok = false; break; }
            const r = msg.obj || {};
            b.progress.applied += (r.applied || 0);
            b.progress.skipped += (r.skipped || 0);
            b.progress.done += batch.length;
            this.bulkTickEta(start);
          }
        }
        b.progress.running = false;
        b.confirmLoading = false;
        // Same reason as runBulkOps: a partial delete has already credited back
        // whatever the removed accounts never used.
        await this.refreshResellerBalance();
        if (ok) {
          b.visible = false;
          this.$message.success('{{ i18n "pages.inbounds.bulkDone" }} {{ i18n "pages.inbounds.bulkAffected" }}: ' + b.progress.applied + ' {{ i18n "pages.inbounds.bulkSkipped" }}: ' + b.progress.skipped);
          this.clearSelection();
          await this.getDBInbounds();
        }
      },
      // Single definition in model/inbound.js, mirrored by clientIdentityKey() in
      // web/service/inbound.go. Do not inline the switch here again.
      getClientId(protocol, client) {
        return getClientIdentity(protocol, client);
      },
      checkFallback(dbInbound) {
        newDbInbound = new DBInbound(dbInbound);
        if (dbInbound.listen.startsWith("@")) {
          rootInbound = this.inbounds.find((i) =>
            i.isTcp &&
            ['trojan', 'vless'].includes(i.protocol) &&
            i.settings.fallbacks.find(f => f.dest === dbInbound.listen)
          );
          if (rootInbound) {
            newDbInbound.listen = rootInbound.listen;
            newDbInbound.port = rootInbound.port;
            newInbound = newDbInbound.toInbound();
            newInbound.stream.security = rootInbound.stream.security;
            newInbound.stream.tls = rootInbound.stream.tls;
            newInbound.stream.externalProxy = rootInbound.stream.externalProxy;
            newDbInbound.streamSettings = newInbound.stream.toString();
          }
        }
        return newDbInbound;
      },
      isClientSel(inboundId, email) {
        return this.selInbounds.includes(inboundId) || this.selClients.includes(inboundId + ':' + email);
      },
      toggleClientSel(inboundId, email, checked) {
        // If the whole inbound was selected, unpack it into explicit per-client keys
        // first, so unchecking one client keeps the others selected.
        if (this.selInbounds.includes(inboundId)) {
          const dbInbound = this.dbInbounds.find(r => r.id === inboundId);
          const emails = (this.getInboundClients(dbInbound) || []).map(c => c.email).filter(Boolean);
          this.selInbounds = this.selInbounds.filter(x => x !== inboundId);
          emails.forEach(em => { const k = inboundId + ':' + em; if (!this.selClients.includes(k)) this.selClients.push(k); });
        }
        const key = inboundId + ':' + email;
        if (checked) { if (!this.selClients.includes(key)) this.selClients.push(key); }
        else { this.selClients = this.selClients.filter(k => k !== key); }
      },
      // Per-inbound "select all clients" (client-table header checkbox). Operates
      // ONLY on selClients — never selInbounds — so the inbound row itself is never
      // selected (a select-all of clients must not delete/select the inbound).
      isAllClientsSel(dbInbound) {
        if (!dbInbound) return false;
        const emails = (this.getInboundClients(dbInbound) || []).map(c => c.email).filter(Boolean);
        return emails.length > 0 && emails.every(em => this.isClientSel(dbInbound.id, em));
      },
      isSomeClientsSel(dbInbound) {
        if (!dbInbound) return false;
        const emails = (this.getInboundClients(dbInbound) || []).map(c => c.email).filter(Boolean);
        const n = emails.filter(em => this.isClientSel(dbInbound.id, em)).length;
        return n > 0 && n < emails.length;
      },
      toggleSelectAllClients(dbInbound, checked) {
        if (!dbInbound) return;
        const id = dbInbound.id;
        const emails = (this.getInboundClients(dbInbound) || []).map(c => c.email).filter(Boolean);
        // If the inbound was wholesale-selected, unpack it into per-client keys and
        // drop it from selInbounds first (mirrors toggleClientSel above).
        if (this.selInbounds.includes(id)) {
          this.selInbounds = this.selInbounds.filter(x => x !== id);
          emails.forEach(em => { const k = id + ':' + em; if (!this.selClients.includes(k)) this.selClients.push(k); });
        }
        if (checked) {
          emails.forEach(em => { const k = id + ':' + em; if (!this.selClients.includes(k)) this.selClients.push(k); });
        } else {
          this.selClients = this.selClients.filter(k => !k.startsWith(id + ':'));
        }
      },
      // --- export (txt / pdf) -------------------------------------------
      async exportTxt(targets, filename) {
        if (!targets || !targets.length) { this.$message.warning('{{ i18n "pages.inbounds.exportNoneSelected" }}'); return; }
        try {
          const cards = await AccountExport.buildCards(this, targets);
          if (!cards.length) { this.$message.warning('{{ i18n "pages.inbounds.exportNoneSelected" }}'); return; }
          AccountExport.txt(cards, filename || 'accounts');
        } catch (e) { this.$message.error('Export failed: ' + (e && e.message ? e.message : e)); }
      },
      async exportPdf(targets, filename) {
        if (!targets || !targets.length) { this.$message.warning('{{ i18n "pages.inbounds.exportNoneSelected" }}'); return; }
        try {
          const cards = await AccountExport.buildCards(this, targets);
          if (!cards.length) { this.$message.warning('{{ i18n "pages.inbounds.exportNoneSelected" }}'); return; }
          AccountExport.pdf(cards, filename || 'accounts');
        } catch (e) { this.$message.error('Export failed: ' + (e && e.message ? e.message : e)); }
      },
      // Single-account export straight from a client row's action buttons.
      exportClientTxt(dbInbound, client) { this.exportTxt([{ inboundId: dbInbound.id, email: client.email }], client.email || dbInbound.remark); },
      exportClientPdf(dbInbound, client) { this.exportPdf([{ inboundId: dbInbound.id, email: client.email }], client.email || dbInbound.remark); },
      // A map rather than a Set: it is read from a template expression, and Vue 2
      // does not make a Set's contents reactive.
      emailsInUse() {
        const seen = {};
        (this.dbInbounds || []).forEach(dbInbound => {
          (this.getInboundClients(dbInbound) || []).forEach(client => {
            if (client && client.email) seen[client.email] = true;
          });
        });
        return seen;
      },
      findIndexOfClient(protocol, clients, client) {
        if (!clients || !Array.isArray(clients) || !client) {
          return -1;
        }
        switch (protocol) {
          case Protocols.TROJAN:
          case Protocols.SHADOWSOCKS:
          case Protocols.ANYTLS:
          case Protocols.NAIVE:
          case Protocols.L2TP:
          case Protocols.PPTP:
          case Protocols.OPENVPN:
          case Protocols.OPENCONNECT:
          case Protocols.SSTP:
          case Protocols.IKEV2:
            return clients.findIndex(item => item && item.password === client.password && item.email === client.email);
          // TUIC deliberately stays on the default branch: it carries BOTH a uuid and
          // a password, and the uuid is its identity (clientIdentityKey /
          // getClientIdentity both key it on id).
          default: return clients.findIndex(item => item && item.id === client.id && item.email === client.email);
        }
      },
      // Switch an account on or off on ONE inbound.
      //
      // Its own route, not a client update carrying enable:false. `enable` inside a
      // posted client entry is the ACCOUNT's flag: the panel writes it to
      // client_traffics, which RADIUS (radius.go:769) and the rbridge sweep
      // (radius.go:701) both read panel-wide. So this switch used to take the
      // customer off EVERY inbound while re-projecting only this one, leaving the
      // other memberships' rows still reading enable:true - the page showed them as
      // serving and they were not. The per-membership flag lives on
      // account_inbounds.enable and the projection renders the AND of the two.
      async setMembershipEnable(dbInboundId, email, enable) {
        await this.submit(
          `/panel/api/inbounds/${dbInboundId}/setMembershipEnable/${encodeURIComponent(email)}`,
          { enable: !!enable });
      },
      delClient(dbInboundId, client, confirmation = true) {
        dbInbound = this.dbInbounds.find(row => row.id === dbInboundId);
        clientId = this.getClientId(dbInbound.protocol, client);
        if (confirmation) {
          this.$confirm({
            title: '{{ i18n "pages.inbounds.deleteClient"}}' + ' ' + client.email,
            content: '{{ i18n "pages.inbounds.deleteClientContent"}}',
            class: themeSwitcher.currentTheme,
            okText: '{{ i18n "delete"}}',
            cancelText: '{{ i18n "cancel"}}',
            onOk: () => this.submit(`/panel/api/inbounds/${dbInboundId}/delClient/${clientId}`),
          });
        } else {
          this.submit(`/panel/api/inbounds/${dbInboundId}/delClient/${clientId}`);
        }
      },
      showQrcode(dbInboundId, client) {
        dbInbound = this.dbInbounds.find(row => row.id === dbInboundId);
        newDbInbound = this.checkFallback(dbInbound);
        qrModal.show('{{ i18n "qrCode"}}', newDbInbound, client);
      },
      showWgcConfig(dbInboundId, client) {
        // WireGuard (C) configs are rendered server-side (per-device .conf with
        // backend-minted keys); the modal fetches them from the wgc-configs API.
        wgcConfigModal.show(dbInboundId, client);
      },
      showWireguardXrayConfig(dbInboundId, client) {
        // Xray-native WireGuard. Same viewer as wg-c above and the same server-side
        // rendering, off a different endpoint: the two implementations differ in
        // where the tunnel is terminated, not in what a client installs.
        wgcConfigModal.show(dbInboundId, client, 'wgxray-configs');
      },
      showAwgConfig(dbInboundId, client) {
        // AmneziaWG configs are rendered server-side (per-device .conf with
        // backend-minted keys + obfuscation params); the modal fetches them from
        // the awg-configs API.
        awgConfigModal.show(dbInboundId, client);
      },
      showGreConfig(dbInboundId, client) {
        // GRE "configs" are the router-side values rendered server-side (no profile file
        // and nothing to scan: the client is a router); the modal fetches them from the
        // gre-configs API.
        greConfigModal.show(dbInboundId, client);
      },
      showSshConfig(dbInboundId, client) {
        // SSH configs are rendered server-side (a sing-box ssh outbound plus a
        // plaintext host/port/user/pass block); the modal fetches them from the
        // ssh-configs API.
        sshConfigModal.show(dbInboundId, client);
      },
      showInfo(dbInboundId, client) {
        dbInbound = this.dbInbounds.find(row => row.id === dbInboundId);
        if (!dbInbound) return;
        // Called two ways. With a client it is ONE MEMBERSHIP, which the redesigned
        // panel answers; without one it is the Inbounds page asking about a
        // non-multi-user inbound, which only inboundInfoModal renders (tunnel, socks,
        // http, Xray-native WireGuard peers, single-config Shadowsocks). The typeof
        // guard is not defensiveness: the Inbounds page does not include the new
        // modal, and reaching for an absent global is a ReferenceError, not a no-op.
        if (client && typeof membershipInfoModal !== 'undefined') {
          membershipInfoModalApp.app = this;
          membershipInfoModal.show(this.checkFallback(dbInbound), client);
          return;
        }
        index = 0;
        if (dbInbound.isMultiUser()) {
          inbound = dbInbound.toInbound();
          clients = inbound && inbound.clients ? inbound.clients : null;
          if (clients && Array.isArray(clients)) {
            index = this.findIndexOfClient(dbInbound.protocol, clients, client);
            if (index < 0) index = 0;
          }
        }
        newDbInbound = this.checkFallback(dbInbound);
        infoModal.show(newDbInbound, index);
      },
      // The per-inbound switch in the Clients page's membership rows. Addressed by
      // EMAIL rather than by the protocol's client id: the account is the same
      // customer on every inbound, and the email is the one identity all of them
      // share, so this needs none of the per-protocol id resolution a client edit
      // does.
      async switchEnableClient(dbInboundId, client, state) {
        this.loading();
        try {
          const email = client && client.email;
          if (!email) return;
          await this.setMembershipEnable(
            dbInboundId, email, typeof state === 'boolean' ? state : !!client.enable);
        } finally {
          this.loading(false);
        }
      },
      isFrozen(client) {
        // Frozen = disabled with a locked (negative, non-ticking) remaining time.
        return !!client && client.enable === false && Number(client.expiryTime) < 0;
      },
      async toggleFreeze(dbInboundId, client) {
        // Freeze/unfreeze reuse the bulk endpoint (single target) so the time-lock math
        // lives in one place (the backend). Freeze disables + locks remaining days;
        // unfreeze re-enables + resumes them.
        if (!client || !client.email) return;
        const op = this.isFrozen(client) ? 'unfreeze' : 'freeze';
        this.loading();
        try {
          const payload = {
            op, days: 0, amountBytes: 0,
            skipFirstUse: false, skipUnlimited: false, skipDisabled: false,
            targets: [{ inboundId: dbInboundId, email: client.email }],
          };
          const msg = await HttpUtil.post('/panel/api/inbounds/bulkUpdateClients', { data: JSON.stringify(payload) });
          if (msg.success) {
            this.$message.success(op === 'freeze'
              ? '{{ i18n "pages.client.freeze" }}' : '{{ i18n "pages.client.unfreeze" }}');
            await this.getDBInbounds();
            // Goes through the same bulk endpoint as the rest, so it is refreshed
            // alongside them rather than being the one path that drifts.
            await this.refreshResellerBalance();
          }
        } finally {
          this.loading(false);
        }
      },
      getInboundClients(dbInbound) {
        if (!dbInbound) return null;
        const inbound = dbInbound.toInbound();
        return inbound && inbound.clients ? inbound.clients : null;
      },
      // Every inbound serving this account, for the row badge and for the client
      // form's membership checklist. Reads the index below, so a row costs a map
      // lookup rather than a walk over every inbound's settings JSON.
      clientInbounds(email) {
        return this.membershipIndex[accountKeyOf(email)] || [];
      },
      clientInboundCount(email) {
        return this.clientInbounds(email).length;
      },
      // The badge's tooltip heading. The inbounds themselves are listed under it.
      clientMembershipTitle(email) {
        return '{{ i18n "pages.inbounds.membershipOnInbounds" }}'
          .replace('%COUNT%', this.clientInboundCount(email));
      },
      resetClientTraffic(client, dbInboundId, confirmation = true) {
        if (confirmation) {
          this.$confirm({
            title: '{{ i18n "pages.inbounds.resetTraffic"}}' + ' ' + client.email,
            content: '{{ i18n "pages.inbounds.resetTrafficContent"}}',
            class: themeSwitcher.currentTheme,
            okText: '{{ i18n "reset"}}',
            cancelText: '{{ i18n "cancel"}}',
            onOk: () => this.submit('/panel/api/inbounds/' + dbInboundId + '/resetClientTraffic/' + client.email),
          })
        } else {
          this.submit('/panel/api/inbounds/' + dbInboundId + '/resetClientTraffic/' + client.email);
        }
      },
      resetAllClientTraffics(dbInboundId) {
        this.$confirm({
          title: dbInboundId > 0 ? '{{ i18n "pages.inbounds.resetInboundClientTrafficTitle"}}' : '{{ i18n "pages.inbounds.resetAllClientTrafficTitle"}}',
          content: dbInboundId > 0 ? '{{ i18n "pages.inbounds.resetInboundClientTrafficContent"}}' : '{{ i18n "pages.inbounds.resetAllClientTrafficContent"}}',
          class: themeSwitcher.currentTheme,
          okText: '{{ i18n "reset"}}',
          cancelText: '{{ i18n "cancel"}}',
          onOk: () => this.submit('/panel/api/inbounds/resetAllClientTraffics/' + dbInboundId),
        })
      },
      delDepletedClients(dbInboundId) {
        this.$confirm({
          title: '{{ i18n "pages.inbounds.delDepletedClientsTitle"}}',
          content: '{{ i18n "pages.inbounds.delDepletedClientsContent"}}',
          class: themeSwitcher.currentTheme,
          okText: '{{ i18n "delete"}}',
          cancelText: '{{ i18n "cancel"}}',
          onOk: () => this.submit('/panel/api/inbounds/delDepletedClients/' + dbInboundId),
        })
      },
      getClientStats(dbInbound, email) {
        if (!dbInbound) return null;
        if (!dbInbound._clientStatsMap) {
            dbInbound._clientStatsMap = new Map();
            if (dbInbound.clientStats && Array.isArray(dbInbound.clientStats)) {
                for (const stats of dbInbound.clientStats) {
                    dbInbound._clientStatsMap.set(stats.email, stats);
                }
            }
        }
        return dbInbound._clientStatsMap.get(email);
      },
      getUpStats(dbInbound, email) {
        if (!email || email.length == 0) return 0;
        let clientStats = this.getClientStats(dbInbound, email);
        return clientStats ? clientStats.up : 0;
      },
      getDownStats(dbInbound, email) {
        if (!email || email.length == 0) return 0;
        let clientStats = this.getClientStats(dbInbound, email);
        return clientStats ? clientStats.down : 0;
      },
      getSumStats(dbInbound, email) {
        if (!email || email.length == 0) return 0;
        let clientStats = this.getClientStats(dbInbound, email);
        return clientStats ? clientStats.up + clientStats.down : 0;
      },
      getAllTimeClient(dbInbound, email) {
        if (!email || email.length == 0) return 0;
        let clientStats = this.getClientStats(dbInbound, email);
        if (!clientStats) return 0;
        return clientStats.allTime || (clientStats.up + clientStats.down);
      },
      // --- per-inbound usage ------------------------------------------------
      // The four above answer "how much has this ACCOUNT used", which is the right
      // question for anything measured against the quota: the quota is account-wide,
      // so a progress bar or a depletion check fed one inbound's slice would read
      // empty for a customer who is actually out of traffic.
      //
      // These answer "how much came through THIS inbound", which is only meaningful
      // where an inbound is named. Server-side split (attachClientStats), from the
      // account's membership row.
      getInboundUpStats(dbInbound, email) {
        if (!email || email.length == 0) return 0;
        let clientStats = this.getClientStats(dbInbound, email);
        return clientStats ? (clientStats.inboundUp || 0) : 0;
      },
      getInboundDownStats(dbInbound, email) {
        if (!email || email.length == 0) return 0;
        let clientStats = this.getClientStats(dbInbound, email);
        return clientStats ? (clientStats.inboundDown || 0) : 0;
      },
      getInboundSumStats(dbInbound, email) {
        return this.getInboundUpStats(dbInbound, email) + this.getInboundDownStats(dbInbound, email);
      },
      getInboundAllTime(dbInbound, email) {
        if (!email || email.length == 0) return 0;
        let clientStats = this.getClientStats(dbInbound, email);
        if (!clientStats) return 0;
        return clientStats.inboundAllTime || (clientStats.inboundUp + clientStats.inboundDown) || 0;
      },
      // Whether the three above are this inbound's own or the account's pooled
      // remainder. True only for the Xray-native protocols, whose per-user stat
      // carries no inbound name, so the same number stands for every one of them
      // serving the account. Set server-side; never inferred from the protocol
      // here, so the two cannot drift apart.
      isSharedStats(dbInbound, email) {
        if (!email || email.length == 0) return false;
        let clientStats = this.getClientStats(dbInbound, email);
        return !!(clientStats && clientStats.shared);
      },
      getRemStats(dbInbound, email) {
        if (!email || email.length == 0) return 0;
        let clientStats = this.getClientStats(dbInbound, email);
        if (!clientStats) return 0;
        let remained = clientStats.total - (clientStats.up + clientStats.down);
        return remained > 0 ? remained : 0;
      },
      clientStatsColor(dbInbound, email) {
        if (!email || email.length == 0) return ColorUtils.clientUsageColor();
        let clientStats = this.getClientStats(dbInbound, email);
        return ColorUtils.clientUsageColor(clientStats, app.trafficDiff)
      },
      statsProgress(dbInbound, email) {
        if (!email || email.length == 0) return 100;
        let clientStats = this.getClientStats(dbInbound, email);
        if (!clientStats) return 0;
        if (clientStats.total == 0) return 100;
        return 100 * (clientStats.down + clientStats.up) / clientStats.total;
      },
      expireProgress(expTime, reset) {
        now = new Date().getTime();
        remainedSeconds = expTime < 0 ? -expTime / 1000 : (expTime - now) / 1000;
        resetSeconds = reset * 86400;
        if (remainedSeconds >= resetSeconds) return 0;
        return 100 * (1 - (remainedSeconds / resetSeconds));
      },
      statsExpColor(dbInbound, email) {
        if (!email || email.length == 0) return '#7a316f';
        let clientStats = this.getClientStats(dbInbound, email);
        if (!clientStats) return '#7a316f';
        let statsColor = ColorUtils.usageColor(clientStats.down + clientStats.up, this.trafficDiff, clientStats.total);
        let expColor = ColorUtils.usageColor(new Date().getTime(), this.expireDiff, clientStats.expiryTime);
        switch (true) {
          case statsColor == "red" || expColor == "red":
            return "#cf3c3c"; // Red
          case statsColor == "orange" || expColor == "orange":
            return "#f37b24"; // Orange
          case statsColor == "green" || expColor == "green":
            return "#008771"; // Green
          default:
            return "#7a316f"; // purple
        }
      },
      isClientDepleted(dbInbound, email) {
        if (!email || !dbInbound) return false;
        const stats = this.getClientStats(dbInbound, email);
        if (!stats) return false;
        const total = stats.total ?? 0;
        const used = (stats.up ?? 0) + (stats.down ?? 0);
        const hasTotal = total > 0;
        const exhausted = hasTotal && used >= total;
        const expiryTime = stats.expiryTime ?? 0;
        const hasExpiry = expiryTime > 0;
        const now = Date.now();
        const expired = hasExpiry && expiryTime <= now;
        return expired || exhausted;
      },
      isClientOnline(email) {
        return this.onlineClients.includes(email);
      },
      // --- per-membership liveness -----------------------------------------
      // Which of an account's inbounds it is actually connected over.
      //
      // The account-wide flag (isClientOnline, the lamp on the row) says only THAT a
      // customer is connected. Both pages used to read it per inbound, so an account
      // on ssh and l2tp connecting over ssh showed both as live, and an account on ten
      // inbounds counted as an online client on all ten.
      //
      // The set the server sends is "<inboundId>:<email>" per pair seen in the last
      // traffic tick, with inbound 0 for a session whose source inbound could not be
      // named at all. That is now rare - the core's per-user stat carries no inbound,
      // but the panel resolves it whenever only one of the account's inbounds could
      // have produced it (web/service/coreattribution.go) - and what is left over is
      // marked live-but-ambiguous rather than guessed at, exactly as its usage figure
      // is marked shared.
      //
      // Indexed once per refresh: this is called for every rendered block, and
      // Array.includes over the whole panel's sessions per block is quadratic.
      membershipOnlineIndex() {
        const list = this.onlineMemberships || [];
        if (this._onlineIdxSrc !== list) {
          this._onlineIdxSrc = list;
          this._onlineIdx = new Set(list);
        }
        return this._onlineIdx;
      },
      // Seen on THIS inbound. The email is normalised the way the server normalises
      // it, or an account created as "Foo@x" never matches its own session.
      membershipOnline(dbInbound, email) {
        if (!dbInbound || !email) return false;
        return this.membershipOnlineIndex().has(dbInbound.id + ':' + String(email).trim().toLowerCase());
      },
      // Live, but on one of this account's Xray-native inbounds without the core
      // saying which. Gated on the server's own `shared` flag rather than on a
      // protocol list kept here, so the liveness and the usage figure cannot end up
      // disagreeing about whether an inbound can account for itself.
      membershipOnlineShared(dbInbound, email) {
        if (!dbInbound || !email) return false;
        if (!this.isSharedStats(dbInbound, email)) return false;
        return this.membershipOnlineIndex().has('0:' + String(email).trim().toLowerCase());
      },
      membershipLampClass(dbInbound, email) {
        if (this.membershipOnline(dbInbound, email)) return 'bo-mb-lamp--live';
        if (this.membershipOnlineShared(dbInbound, email)) return 'bo-mb-lamp--maybe';
        return '';
      },
      membershipOnlineText(dbInbound, email) {
        if (this.membershipOnline(dbInbound, email)) return '{{ i18n "online" }}';
        if (this.membershipOnlineShared(dbInbound, email)) return '{{ i18n "pages.clients.onlineShared" }}';
        return '{{ i18n "offline" }}';
      },
      getLastOnline(email) {
        return this.lastOnlineMap[email] || null
      },
      formatLastOnline(email) {
        const ts = this.getLastOnline(email)
        if (!ts) return '-'
        // Check if IntlUtil is available (may not be loaded yet)
        if (typeof IntlUtil !== 'undefined' && IntlUtil.formatDate) {
          return IntlUtil.formatDate(ts)
        }
        // Fallback to simple date formatting if IntlUtil is not available
        return new Date(ts).toLocaleString()
      },
      isRemovable(dbInboundId) {
        return this.getInboundClients(this.dbInbounds.find(row => row.id === dbInboundId)).length > 1;
      },
    },
  };
</script>
