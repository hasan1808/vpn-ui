{{define "settings/xray/outbounds"}}
<a-space direction="vertical" size="middle">
    <a-row>
        <a-col :xs="12" :sm="12" :lg="12">
            <a-space direction="horizontal" size="small">
                <a-button type="primary" icon="plus" @click="addOutbound">
                    <span v-if="!isMobile">{{ i18n
                        "pages.xray.outbound.addOutbound" }}</span>
                </a-button>
                <!-- Runs a reachability test for every testable outbound in
                     sequence, updating each row's result as it completes. The
                     same pass also runs automatically on page load and every
                     60s. -->
                <a-button icon="thunderbolt" @click="autoTestOutbounds()"
                    :loading="autoTesting">
                    <span v-if="!isMobile">{{ i18n
                        "pages.xray.outbound.testAll" }}</span>
                </a-button>
                <a-button type="primary" icon="cloud"
                    @click="showWarp()">WARP</a-button>
                <a-button type="primary" icon="api"
                    @click="showNord()">NordVPN</a-button>
                <!-- No SSH or VPN Tunnel button: both are protocols in the Add
                     Outbound picker now, which is where an operator looks for
                     one. WARP and NordVPN stay because neither is a protocol,
                     they are account setup flows for a specific provider. -->
            </a-space>
        </a-col>
        <a-col :xs="12" :sm="12" :lg="12" :style="{ textAlign: 'right' }">
            <a-button-group>
                <a-button icon="sync" @click="refreshOutboundTraffic()"
                    :loading="refreshing"></a-button>
                <a-popconfirm placement="topRight"
                    @confirm="resetOutboundTraffic(-1)"
                    title='{{ i18n "pages.inbounds.resetTrafficContent"}}'
                    :overlay-class-name="themeSwitcher.currentTheme"
                    ok-text='{{ i18n "reset"}}'
                    cancel-text='{{ i18n "cancel"}}'>
                    <a-icon slot="icon" type="question-circle-o"
                        :style="{ color: themeSwitcher.isDarkTheme ? '#008771' : '#008771' }"></a-icon>
                    <a-button icon="retweet"></a-button>
                </a-popconfirm>
            </a-button-group>
        </a-col>
    </a-row>
    <a-table :columns="outboundColumns" bordered :row-key="r => r.key"
        :data-source="outboundData"
        :scroll="isMobile ? {} : { x: 800 }" :pagination="false"
        :indent-size="0"
        :locale='{ filterConfirm: `{{ i18n "confirm" }}`, filterReset: `{{ i18n "reset" }}` }'>
        <template slot="action" slot-scope="text, outbound, index">
            <span>[[ index+1 ]]</span>
            <a-dropdown :trigger="['click']">
                <a-icon @click="e => e.preventDefault()" type="more"
                    :style="{ fontSize: '16px', textDecoration: 'bold' }"></a-icon>
                <a-menu slot="overlay" :theme="themeSwitcher.currentTheme">
                    <a-menu-item v-if="index>0"
                        @click="setFirstOutbound(index)">
                        <a-icon type="vertical-align-top"></a-icon>
                        <span>{{ i18n "pages.xray.rules.first"}}</span>
                    </a-menu-item>
                    <a-menu-item @click="editOutbound(index)">
                        <a-icon type="edit"></a-icon>
                        <span>{{ i18n "edit" }}</span>
                    </a-menu-item>
                    <a-menu-item @click="resetOutboundTraffic(index)">
                        <span>
                            <a-icon type="retweet"></a-icon>
                            <span>{{ i18n "pages.inbounds.resetTraffic"}}</span>
                        </span>
                    </a-menu-item>
                    <a-menu-item @click="deleteOutbound(index)">
                        <span :style="{ color: 'var(--error)' }">
                            <a-icon type="delete"></a-icon>
                            <span>{{ i18n "delete"}}</span>
                        </span>
                    </a-menu-item>
                </a-menu>
            </a-dropdown>
        </template>
        <template slot="address" slot-scope="text, outbound, index">
            <p :style="{ margin: '0 5px' }"
                v-for="addr in findOutboundAddress(outbound)">[[ addr ]]</p>
        </template>
        <template slot="protocol" slot-scope="text, outbound, index">
            <!-- Label, not the stored protocol: an SSH tunnel is a socks outbound
                 in the config and has to stay one, and a VPN tunnel is a freedom
                 one, but showing "socks"/"freedom" hides what the operator
                 actually created. -->
            <a-tag :style="{ margin: '0' }" color="purple">[[
                outboundProtocolLabel(outbound) ]]</a-tag>
            <!-- Whether the tunnel behind a VPN row is actually carrying traffic.
                 Only rendered once a probe has answered for it: an outbound with
                 no state yet shows nothing rather than claiming to be down. -->
            <a-tooltip
                v-if="vpnOutboundStatus[outbound.tag]"
                :title="vpnOutboundStatus[outbound.tag].detail">
                <a-tag :style="{ margin: '0' }"
                    :color="vpnOutboundStatus[outbound.tag].up ? 'green' : 'orange'">[[
                    vpnOutboundStatus[outbound.tag].up ? '{{ i18n
                    "pages.xray.outbound.vpnOutUp" }}' : '{{ i18n
                    "pages.xray.outbound.vpnOutDown" }}' ]]</a-tag>
            </a-tooltip>
            <!-- anytls, tuic and naive are here for the same reason as the four
                 above: all three carry a real streamSettings and the transport is
                 the thing that has to match the far side, so it belongs on the
                 row rather than only inside the edit dialog. TUIC's always reads
                 "tuic", which is the point: it says the row is on the QUIC
                 transport and not on some tcp stream a hand-edited config left
                 behind. naive's is the one worth reading at a glance, because it
                 is the only row here where the tag distinguishes two different
                 stacks: "tcp" is HTTP/2 and "naive" is HTTP/3.

                 `outbound.streamSettings &&` guards the whole block: this table
                 renders the config VERBATIM, and a hand-written outbound with no
                 streamSettings would otherwise throw on .network mid-render and
                 leave the page blank behind v-cloak. -->
            <template
                v-if="outbound.streamSettings && [Protocols.VMess, Protocols.VLESS, Protocols.Trojan, Protocols.Shadowsocks, Protocols.AnyTLS, Protocols.Tuic, Protocols.Naive].includes(outbound.protocol)">
                <a-tag :style="{ margin: '0' }" color="blue">[[
                    outbound.streamSettings.network ]]</a-tag>
                <a-tag :style="{ margin: '0' }"
                    v-if="outbound.streamSettings.security=='tls'"
                    color="green">tls</a-tag>
                <a-tag :style="{ margin: '0' }"
                    v-if="outbound.streamSettings.security=='reality'"
                    color="green">reality</a-tag>
            </template>
        </template>
        <template slot="traffic" slot-scope="text, outbound, index">
            <!-- Green says MEASURED, and a measured zero keeps it. With both
                 outbound stats switches off the core registers no counter at
                 all, so an outbound with no row has not moved zero bytes, it has
                 not been counted: that gets a neutral tag and a tooltip naming
                 the switch that starts the counting. -->
            <a-tooltip v-if="!outboundTrafficMeasured(outbound)"
                title='{{ i18n "pages.xray.outbound.trafficUnmeasuredDesc" }}'>
                <a-tag :style="{ margin: '0' }">[[
                    findOutboundTraffic(outbound) ]]</a-tag>
            </a-tooltip>
            <a-tag v-else color="green">[[ findOutboundTraffic(outbound)
                ]]</a-tag>
        </template>
        <template slot="test" slot-scope="text, outbound, index">
            <a-tooltip>
                <template slot="title">{{ i18n "pages.xray.outbound.test"
                    }}</template>
                <a-button
                    type="primary"
                    shape="circle"
                    icon="thunderbolt"
                    :loading="outboundTestStates[index] && outboundTestStates[index].testing"
                    @click="testOutbound(index)"
                    :disabled="(outbound.protocol === 'blackhole' || outbound.tag === 'blocked') || (outboundTestStates[index] && outboundTestStates[index].testing)">
                </a-button>
            </a-tooltip>
        </template>
        <template slot="testResult" slot-scope="text, outbound, index">
            <div
                v-if="outboundTestStates[index] && outboundTestStates[index].result">
                <a-tag v-if="outboundTestStates[index].result.success"
                    color="green">
                    [[ outboundTestStates[index].result.delay ]]ms
                    <span v-if="outboundTestStates[index].result.statusCode">
                        ([[ outboundTestStates[index].result.statusCode
                        ]])</span>
                </a-tag>
                <!-- Where the outbound actually egresses, probed through the
                     outbound itself. Best-effort, so a successful test with no
                     exit info simply shows the delay tag alone. -->
                <div class="ob-exit" v-if="outboundTestStates[index].result.success && exitInfo(index)">
                    <a-tooltip v-if="exitCountry(index)" :title="exitCountry(index)">
                        <span class="ob-exit-flag">[[ exitFlag(index) ]]</span>
                    </a-tooltip>
                    <span class="ob-exit-ips">
                        <span class="ob-exit-ip num" v-if="exitInfo(index).ipv4">[[ exitInfo(index).ipv4 ]]</span>
                        <span class="ob-exit-ip num" v-if="exitInfo(index).ipv6"
                            :title="exitInfo(index).ipv6">[[ exitInfo(index).ipv6 ]]</span>
                    </span>
                </div>
                <a-tooltip v-else
                    :title="outboundTestStates[index].result.error">
                    <a-tag color="red">
                        Failed
                    </a-tag>
                </a-tooltip>
                <!-- When was this result last obtained. Set on every fresh run
                     and restored from the persisted status on page load, so a
                     reload does not turn an old outcome into a current one. -->
                <div class="ob-last" v-if="lastTestedAt(index)">
                    <span class="ob-last-time">[[ lastTestedAt(index) ]]</span>
                </div>
            </div>
            <span
                v-else-if="outboundTestStates[index] && outboundTestStates[index].testing">
                <a-icon type="loading" />
            </span>
            <span v-else>-</span>
        </template>
    </a-table>
</a-space>
{{end}}
